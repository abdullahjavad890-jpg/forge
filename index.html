<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forge">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Forge</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <main id="view"></main>

  <div id="minibar"></div>

  <nav id="tabbar">
    <button class="tab" data-a="tab" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="tab" data-a="tab" data-tab="history"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button class="tab-go" data-a="startMenu" aria-label="Start workout"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-a="tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg><span>Progress</span></button>
    <button class="tab" data-a="tab" data-tab="more"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>More</span></button>
  </nav>

  <section id="workout" aria-label="Active workout"></section>
  <div id="toasts"></div>
  <canvas id="confetti"></canvas>
  <input type="file" id="importFile" accept=".json,application/json" data-c="import" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
