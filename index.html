<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forge">
  <meta name="theme-color" content="#F2EEE4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Forge tracks your workouts, rest, cardio and weekly progress.">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500..600&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="view"></main>

  <div id="minibar"></div>

  <nav id="tabbar" aria-label="Main">
    <button class="tab" data-a="tab" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></button>
    <button class="tab" data-a="tab" data-tab="history"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>History</span></button>
    <button class="tab-go" data-a="startMenu" aria-label="Start workout"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-a="tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/><path d="M15 7h4v4"/></svg><span>Progress</span></button>
    <button class="tab" data-a="tab" data-tab="more"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>More</span></button>
  </nav>

  <section id="workout" aria-label="Active workout"></section>
  <div id="onboard"></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="importFile" accept=".json,application/json" data-c="import" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
